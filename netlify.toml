[build]
command = "npm run setup:deploy && npm run build"
publish = "public"

[functions]
node_bundler = "esbuild"
external_node_modules = ["@electric-sql/pglite"]

[[redirects]]
from = "/api/*"
to = "/.netlify/functions/api/:splat"
status = 200
force = true

[[headers]]
for = "/*"
  [headers.values]
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'; upgrade-insecure-requests"
  X-Content-Type-Options = "nosniff"
  Referrer-Policy = "no-referrer"
  X-Frame-Options = "DENY"
